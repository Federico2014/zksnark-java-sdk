name: Native build matrix

on:
  push:
    branches: [ci/native-build-matrix, feature/improve_zksnark, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: macos-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '8'
      - name: Install build tools
        run: bash scripts/setup-ci-tools.sh
      - name: Test artifact validation
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Build native library and run tests
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: bash scripts/build-native.sh "$NATIVE_PLATFORM"
      - name: Upload native artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.platform }}
          path: cpp/build/ci-${{ matrix.platform }}/artifact/
          if-no-files-found: error
          retention-days: 7
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.platform }}
          path: |
            cpp/build/ci-${{ matrix.platform }}/*.log
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

  package:
    name: Assemble SDK JAR
    needs: native
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '8'
      - name: Install build tools
        run: bash scripts/setup-ci-tools.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: downloaded-native/
      - name: Validate, assemble, and test SDK JAR
        run: bash scripts/package-native.sh downloaded-native/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zksnark-java-sdk-all-platforms
          path: |
            target/zksnark-java-sdk-1.0.0.jar
            target/native-manifest.json
          if-no-files-found: error
          retention-days: 7
